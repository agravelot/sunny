<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <g transform="scale(0.625)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="0.55" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="window"><rect x="129.0" y="129.0" width="254" height="254" rx="25.0"/></clipPath>
    <clipPath id="badge"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g clip-path="url(#window)">
      <circle cx="256" cy="316" r="80" fill="#FDE68A"
              opacity="0.9" filter="url(#glow)"/>
      <circle cx="256" cy="316" r="62" fill="url(#sun)"/>
      <circle cx="256" cy="316" r="62" fill="none"
              stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>
      <rect x="129.0" y="129.0" width="254" height="254" fill="#FFFFFF" opacity="0.12"/>
      <rect x="138" y="141" width="236" height="15" rx="6" fill="#FFFFFF" opacity="0.92"/><rect x="138" y="163" width="236" height="15" rx="6" fill="#FFFFFF" opacity="0.92"/><rect x="138" y="185" width="236" height="15" rx="6" fill="#FFFFFF" opacity="0.92"/><rect x="138" y="207" width="236" height="15" rx="6" fill="#FFFFFF" opacity="0.92"/>
      <rect x="136" y="226" width="240" height="16" rx="8" fill="#FFFFFF" opacity="0.92"/>
    </g>
    <rect x="120" y="120" width="272" height="272" rx="34" fill="none"
          stroke="#FFFFFF" stroke-width="18"/>
  </g>
</g>
  <text x="372" y="178" font-family="Inter, 'Fira Sans', 'Liberation Sans', sans-serif" font-size="140" font-weight="800"
        letter-spacing="-4" fill="#0F172A">Sunny</text>
  <text x="376" y="238" font-family="Inter, 'Fira Sans', 'Liberation Sans', sans-serif" font-size="36" font-weight="500"
        fill="#64748B">Solar-driven blinds for Home Assistant</text>
</svg>
