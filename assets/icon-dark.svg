      <rect x="138" y="141" width="236" height="15" rx="6" fill="#E2E8F0" opacity="0.95"/><rect x="138" y="163" width="236" height="15" rx="6" fill="#E2E8F0" opacity="0.95"/><rect x="138" y="185" width="236" height="15" rx="6" fill="#E2E8F0" opacity="0.95"/><rect x="138" y="207" width="236" height="15" rx="6" fill="#E2E8F0" opacity="0.95"/>
      <rect x="136" y="226" width="240" height="16" rx="8" fill="#E2E8F0" opacity="0.95"/>
