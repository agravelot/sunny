set_auto_control:
  name: Définir le pilotage automatique
  description: Active ou désactive le pilotage automatique des stores Sunny.
  fields:
    enabled:
      name: Activé
      description: true pour activer le pilotage auto, false pour le désactiver.
      required: true
      selector:
        boolean:
    entity_id:
      name: Entités
      description: Les interrupteurs de pilotage auto à cibler. Si vide, agit sur tous.
      selector:
        entity:
          integration: sunny
          domain: switch
          multiple: true
    area_id:
      name: Zones
      description: Cible tous les interrupteurs de pilotage auto Sunny dans ces zones.
      selector:
        area:
          multiple: true

set_cloud_factor:
  name: Définir l'influence des nuages
  description: Règle l'influence des nuages (0-100 %) sur l'ensoleillement estimé, pour toutes les fenêtres. 0 ignore les nuages, 100 annule tout soleil direct sous un ciel entièrement couvert.
  fields:
    value:
      name: Influence (%)
      description: 0 = ignorer les nuages, 100 = annuler tout soleil direct sous ciel couvert.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

refresh:
  name: Rafraîchir l'ensoleillement
  description: Recalcule l'ensoleillement de toutes les fenêtres. À utiliser dans une automation pour remplacer le rafraîchissement périodique.